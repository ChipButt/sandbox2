name: Build 67 External Viewport Colours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build67-external-viewport-colors.yml'
      - '.github/scripts/build67_external_viewport_colors.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Build 67 patch
        run: python3 .github/scripts/build67_external_viewport_colors.py
      - name: Check JavaScript
        run: |
          node --check sweet-truck-jam/game.js
          node --check sweet-truck-jam/game67.js
      - name: Commit Build 67
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sweet-truck-jam/game.js sweet-truck-jam/game67.js sweet-truck-jam/index.html sweet-truck-jam/style.css
          git commit -m 'Publish Build 67 with visual viewport fit and purple brown colours'
          git push
