name: Build 58 Attached Garage Counter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build58-attached-garage-counter.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attach garage counters and publish Build 58
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('sweet-truck-jam/game.js')
          s = path.read_text()

          start = s.index('function garageBadgePlacement(host,trucks){')
          end = s.index('function addUndergroundGarage(gen,r,n){', start)

          replacement = r'''function garageBadgePlacement(host,trucks){
            const badgeW=36,badgeH=24,halfW=badgeW/2,halfH=badgeH/2;
            const ca=Math.cos(host.angle),sa=Math.sin(host.angle);
            const fx=ca,fy=sa,sx=-sa,sy=ca;
            const hatchHL=host.length/2+5;
            const hatchHW=host.width/2+6;
            const others=trucks.filter(t=>t.id!==host.id);
            const clusterX=others.length?others.reduce((a,t)=>a+t.x,0)/others.length:JAM.x+JAM.w/2;
            const clusterY=others.length?others.reduce((a,t)=>a+t.y,0)/others.length:JAM.y+JAM.h/2;

            function badgePoly(c,pad=0){
              return[
                {x:c.x-halfW-pad,y:c.y-halfH-pad},
                {x:c.x+halfW+pad,y:c.y-halfH-pad},
                {x:c.x+halfW+pad,y:c.y+halfH+pad},
                {x:c.x-halfW-pad,y:c.y+halfH+pad}
              ];
            }
            function segmentBox(ax,ay,bx,by,pad=0){
              return[
                {x:Math.min(ax,bx)-pad,y:Math.min(ay,by)-pad},
                {x:Math.max(ax,bx)+pad,y:Math.min(ay,by)-pad},
                {x:Math.max(ax,bx)+pad,y:Math.max(ay,by)+pad},
                {x:Math.min(ax,bx)-pad,y:Math.max(ay,by)+pad}
              ];
            }
            function inYard(c,pad=0){
              return c.x-halfW-pad>=JAM.x+5&&c.x+halfW+pad<=JAM.x+JAM.w-5&&
                     c.y-halfH-pad>=JAM.y+5&&c.y+halfH+pad<=JAM.y+JAM.h-5;
            }
            function badgeExtentAlong(dx,dy){
              return Math.abs(dx)*halfW+Math.abs(dy)*halfH;
            }
            function pathIsClear(poly){
              for(const t of trucks){
                if(t.id!==host.id&&!canDriveOut(t,trucks))continue;
                const dx=Math.cos(t.angle),dy=Math.sin(t.angle);
                const start=t.id===host.id?21:0;
                for(let d=start;d<=130;d+=13){
                  const x=t.x+dx*d,y=t.y+dy*d;
                  if(polyOverlap(poly,truckPoly(t,x,y),0))return false;
                  if(d>0&&!insideJam(t,x,y))break;
                }
              }
              return true;
            }

            // The counter is now an attached tab. It can use either side or
            // the rear of the garage, but never the forward/escape edge.
            const dirs=[
              {dx:sx,dy:sy,edge:hatchHW},
              {dx:-sx,dy:-sy,edge:hatchHW},
              {dx:-fx,dy:-fy,edge:hatchHL}
            ];
            const candidates=[];

            for(const d of dirs){
              const badgeExtent=badgeExtentAlong(d.dx,d.dy);
              // Slightly overlap the garage edge so the tab is physically
              // connected to the tile rather than floating beside it.
              const centreDist=d.edge+badgeExtent-2;
              const c={x:host.x+d.dx*centreDist,y:host.y+d.dy*centreDist};
              if(!inYard(c,9))continue;

              const attach={x:host.x+d.dx*d.edge,y:host.y+d.dy*d.edge};
              const badgeClear=badgePoly(c,9);
              const connectorClear=segmentBox(attach.x,attach.y,c.x,c.y,7);

              if(others.some(t=>polyOverlap(badgeClear,truckPoly(t),4)))continue;
              if(others.some(t=>polyOverlap(connectorClear,truckPoly(t),4)))continue;
              if(!pathIsClear(badgeClear)||!pathIsClear(connectorClear))continue;

              let nearest=999;
              for(const t of others){
                const tr=Math.hypot(t.length/2,t.width/2);
                nearest=Math.min(nearest,Math.hypot(c.x-t.x,c.y-t.y)-tr);
              }
              const hostRadius=Math.hypot(host.x-clusterX,host.y-clusterY);
              const outwardGain=Math.hypot(c.x-clusterX,c.y-clusterY)-hostRadius;
              const score=nearest+outwardGain*1.4;

              candidates.push({
                x:c.x,y:c.y,w:badgeW,h:badgeH,
                attachX:attach.x,attachY:attach.y,
                score
              });
            }

            if(!candidates.length)return null;
            candidates.sort((a,b)=>b.score-a.score);
            return candidates[0];
          }
          '''

          s = s[:start] + replacement + s[end:]

          old = """    currentId:host.id,queue,\n    badgeX:badge.x,badgeY:badge.y,badgeW:badge.w,badgeH:badge.h\n  };"""
          new = """    currentId:host.id,queue,\n    badgeX:badge.x,badgeY:badge.y,badgeW:badge.w,badgeH:badge.h,\n    badgeAttachX:badge.attachX,badgeAttachY:badge.attachY\n  };"""
          if old not in s:
              raise RuntimeError('garage state block not found')
          s = s.replace(old,new,1)

          old = """    badgeX:gen.garage.badgeX,badgeY:gen.garage.badgeY,badgeW:gen.garage.badgeW,badgeH:gen.garage.badgeH,\n    queue:gen.garage.queue.map(t=>({...t,state:'underground'}))"""
          new = """    badgeX:gen.garage.badgeX,badgeY:gen.garage.badgeY,badgeW:gen.garage.badgeW,badgeH:gen.garage.badgeH,\n    badgeAttachX:gen.garage.badgeAttachX,badgeAttachY:gen.garage.badgeAttachY,\n    queue:gen.garage.queue.map(t=>({...t,state:'underground'}))"""
          if old not in s:
              raise RuntimeError('newState garage copy block not found')
          s = s.replace(old,new,1)

          old = """  const bw=g.badgeW||34,bh=g.badgeH||22;\n  roundedRect(bx-bw/2,by-bh/2,bw,bh,bh/2,'#252c35','#fff',1.4);\n  text('↓ '+String(remaining),bx,by,11,'#fff','center',1000);"""
          new = """  const bw=g.badgeW||34,bh=g.badgeH||22;\n\n  // Short neck joins the counter directly to the garage tile. It is drawn\n  // beneath the badge and the truck, so it reads as part of the garage tile.\n  const ax=g.badgeAttachX??g.x,ay=g.badgeAttachY??g.y;\n  ctx.save();\n  ctx.lineCap='round';\n  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);\n  ctx.strokeStyle='#fff';ctx.lineWidth=9;ctx.stroke();\n  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);\n  ctx.strokeStyle='#252c35';ctx.lineWidth=6;ctx.stroke();\n  ctx.restore();\n\n  roundedRect(bx-bw/2,by-bh/2,bw,bh,bh/2,'#252c35','#fff',1.4);\n  text('↓ '+String(remaining),bx,by,11,'#fff','center',1000);"""
          if old not in s:
              raise RuntimeError('drawGarage counter block not found')
          s = s.replace(old,new,1)

          assert 'badgeAttachX:badge.attachX' in s
          assert 'badgeAttachX:gen.garage.badgeAttachX' in s
          assert 'const dirs=[' in s
          assert "ctx.lineTo(bx,by)" in s
          assert 'const SWEET_RADIUS=7;' in s
          assert 'const ROTATION_CAPACITY=144;' in s
          assert 'const TRUCK_GAP=3;' in s

          path.write_text(s)
          Path('sweet-truck-jam/game58.js').write_text(s)

          index = Path('sweet-truck-jam/index.html')
          html = index.read_text()
          html = re.sub(r'game\d+\.js\?v=\d+', 'game58.js?v=58', html)
          html = re.sub(r'style\.css\?v=\d+', 'style.css?v=58', html)
          index.write_text(html)
          PY

          node --check sweet-truck-jam/game.js
          node --check sweet-truck-jam/game58.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sweet-truck-jam/game.js sweet-truck-jam/game58.js sweet-truck-jam/index.html
          git commit -m 'Publish Build 58 with attached clear garage counters'
          git push
