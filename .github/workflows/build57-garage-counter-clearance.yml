name: Build 57 Garage Counter Clearance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build57-garage-counter-clearance.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require clear garage counter placement and publish Build 57
        shell: bash
        run: |
          python3 .github/scripts/build57_garage_counter.py
          node --check sweet-truck-jam/game.js
          node --check sweet-truck-jam/game57.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sweet-truck-jam/game.js sweet-truck-jam/game57.js sweet-truck-jam/index.html
          git commit -m 'Keep garage truck counter clear of surrounding trucks'
          git push
