name: Build 59 Harder Levels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build59-hard-levels.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply harder level generator
        run: python3 .github/scripts/build59_harder_levels.py

      - name: Validate JavaScript
        run: |
          node --check sweet-truck-jam/game.js
          node --check sweet-truck-jam/game59.js

      - name: Publish Build 59
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sweet-truck-jam/game.js sweet-truck-jam/game59.js sweet-truck-jam/index.html
          git commit -m 'Publish Build 59 with substantially harder puzzle generation'
          git push
