name: Build 56 Clockwise Conveyor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build56-clockwise.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reverse central conveyor to clockwise and publish Build 56
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('sweet-truck-jam/game.js')
          s = path.read_text()

          replacements = [
            (
              "const OUTLET_SOURCE_ROW=(OUTLET_ROW-1+LOOP_ROWS)%LOOP_ROWS;",
              "const OUTLET_SOURCE_ROW=(OUTLET_ROW+1)%LOOP_ROWS;"
            ),
            (
              "const rowProgress=((row+phase)%LOOP_ROWS+LOOP_ROWS)%LOOP_ROWS;",
              "const rowProgress=((row-phase)%LOOP_ROWS+LOOP_ROWS)%LOOP_ROWS;"
            ),
            (
              "const r=(OUTLET_SOURCE_ROW-d+LOOP_ROWS)%LOOP_ROWS;",
              "const r=(OUTLET_SOURCE_ROW+d)%LOOP_ROWS;"
            ),
            (
              "state.rotation=[\n    ...state.rotation.slice(state.rotation.length-ROTATION_COLS),\n    ...state.rotation.slice(0,state.rotation.length-ROTATION_COLS)\n  ];",
              "state.rotation=[\n    ...state.rotation.slice(ROTATION_COLS),\n    ...state.rotation.slice(0,ROTATION_COLS)\n  ];"
            )
          ]

          for old,new in replacements:
            count=s.count(old)
            assert count==1, f'Expected exactly one occurrence of {old!r}, found {count}'
            s=s.replace(old,new)

          s=s.replace(
            '// Every row advances one physical position around the loop. Any removed row\n  // therefore becomes a real travelling 4-wide gap.',
            '// Every row advances one physical position CLOCKWISE around the loop. Any\n  // removed row therefore becomes a real travelling 4-wide gap.'
          )

          # Preserve the requested pre-doubling geometry and cached 3D sweets.
          assert 'const SWEET_RADIUS=7;' in s
          assert 'const ROTATION_CAPACITY=144;' in s
          assert "if(LOOP_ROWS>36)" in s
          assert 'const CENTRAL_LANE_SPACING=13.2;' in s
          assert 'const TRUCK_GAP=3;' in s
          assert 'const sweetSpriteCache=new Map();' in s
          assert 'const rowProgress=((row-phase)%LOOP_ROWS+LOOP_ROWS)%LOOP_ROWS;' in s
          assert 'const OUTLET_SOURCE_ROW=(OUTLET_ROW+1)%LOOP_ROWS;' in s

          path.write_text(s)
          Path('sweet-truck-jam/game56.js').write_text(s)

          index=Path('sweet-truck-jam/index.html')
          html=index.read_text()
          html=re.sub(r'game(?:\d+)?\.js\?v=\d+', 'game56.js?v=56', html)
          html=re.sub(r'style\.css\?v=\d+', 'style.css?v=56', html)
          index.write_text(html)
          PY

          node --check sweet-truck-jam/game.js
          node --check sweet-truck-jam/game56.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sweet-truck-jam/game.js sweet-truck-jam/game56.js sweet-truck-jam/index.html
          git commit -m 'Make central sweet conveyor rotate clockwise'
          git push
