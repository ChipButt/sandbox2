name: Deploy Sweet Truck Jam

on:
  push:
    branches: ["main"]
    paths:
      - "sweet-truck-jam/**"
      - ".github/workflows/sweet-truck-jam-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sweet-truck-jam-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: sweet-truck-jam

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
