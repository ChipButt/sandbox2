<title>Sweet Truck Fever</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe9f3;touch-action:none;overscroll-behavior:none;font-family:Arial,Helvetica,sans-serif}

  canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}

<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const SAVE_KEY = 'sweet-truck-fever-clean-v1';

const COLORS = [
  {id:'red',    hex:'#ef304a', dark:'#b4172d', light:'#ff6d7d'},
  {id:'blue',   hex:'#1188ea', dark:'#075aa9', light:'#52b9ff'},
  {id:'yellow', hex:'#f6c51c', dark:'#bd8700', light:'#ffe269'},
  {id:'cyan',   hex:'#22d2dc', dark:'#088b98', light:'#79f0f3'},
  {id:'green',  hex:'#2ed735', dark:'#15911e', light:'#76f57b'},
  {id:'pink',   hex:'#ed42ad', dark:'#aa2277', light:'#ff8bd1'},
  {id:'purple', hex:'#9d43e8', dark:'#6925a8', light:'#c783ff'},
  {id:'orange', hex:'#f18524', dark:'#b64d0b', light:'#ffb25d'},
  {id:'black',  hex:'#25272f', dark:'#0f1015', light:'#555965'}
];
const COLOR_BY_ID = Object.fromEntries(COLORS.map(c => [c.id,c]));

let W=390,H=844,DPR=1;
let layout={};
let level=1, coins=300;
let gridCols=9, gridRows=10;
let trucks=[];
let allTruckData=[];
let slots=[];
let queue=[];
let movingTrucks=[];
let flyingSweets=[];
let confetti=[];
let loading=null;
let overlay=null;
let paused=false;
let inputLockUntil=0;
let lastTime=performance.now();
let toast={text:'',until:0};
let pathPoints=[], pathLengths=[], pathTotal=1;
let boardGenerationOrder=[];
let levelStartTime=0;
let currentSeed=1;

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeInOut(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function norm(x,y){ const d=Math.hypot(x,y)||1; return {x:x/d,y:y/d}; }
function now(){ return performance.now(); }
function color(id){ return COLOR_BY_ID[id] || COLORS[0]; }
function seeded(seed){ let s=seed>>>0; return ()=>{ s+=0x6D2B79F5; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function ri(rng,a,b){ return Math.floor(rng()*(b-a+1))+a; }
function choice(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function shuffle(rng,arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

function roundRectPath(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

function loadSave(){
  try { const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s){level=Math.max(1,s.level||1);coins=s.coins??300;} } catch(_){}
}
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify({level,coins})); }catch(_){} }

function resize(){
  W=Math.max(320,window.innerWidth); H=Math.max(560,window.innerHeight); DPR=Math.min(3,window.devicePixelRatio||1);
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR); canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const top = Math.max(48, H*0.062);
  const trackH = H*0.305;
  const parkH = H*0.165;
  layout.top={x:0,y:0,w:W,h:top};
  layout.track={x:0,y:top,w:W,h:trackH};
  layout.park={x:0,y:top+trackH-2,w:W,h:parkH};
  const boardY=layout.park.y+parkH+5;
  layout.board={x:W*0.025,y:boardY,w:W*0.95,h:H-boardY-8};
  buildTrackPath(level);
}
window.addEventListener('resize',resize,{passive:true});

const TRACK_SHAPES = [
  [[.88,-.08],[.92,.08],[.84,.22],[.66,.31],[.43,.31],[.24,.23],[.19,.09],[.29,.02],[.52,.05],[.71,.12],[.76,.23],[.66,.36],[.50,.42]],
  [[.10,-.05],[.10,.12],[.20,.26],[.38,.34],[.62,.34],[.80,.25],[.90,.08],[.90,-.05],[.84,.13],[.69,.23],[.49,.24],[.32,.20],[.28,.34],[.42,.43],[.50,.45]],
  [[.08,-.04],[.10,.18],[.25,.27],[.44,.23],[.61,.12],[.83,.12],[.92,.27],[.82,.39],[.61,.41],[.42,.34],[.25,.39],[.39,.48],[.50,.49]],
  [[.18,-.04],[.18,.16],[.32,.27],[.49,.28],[.64,.18],[.82,.20],[.88,.34],[.77,.45],[.57,.39],[.48,.31],[.38,.40],[.50,.49]],
  [[.86,-.04],[.87,.17],[.74,.29],[.55,.25],[.43,.14],[.24,.15],[.15,.29],[.27,.41],[.47,.38],[.65,.33],[.63,.45],[.50,.49]]
];

function catmull(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return {x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
          y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)};
}
function buildTrackPath(lvl){
  const r=layout.track; const raw=TRACK_SHAPES[(lvl-1)%TRACK_SHAPES.length].map(([x,y])=>({x:r.x+x*r.w,y:r.y+y*r.h}));
  pathPoints=[];
  for(let i=0;i<raw.length-1;i++){
    const p0=raw[Math.max(0,i-1)],p1=raw[i],p2=raw[i+1],p3=raw[Math.min(raw.length-1,i+2)];
    for(let s=0;s<16;s++) pathPoints.push(catmull(p0,p1,p2,p3,s/16));
  }
  pathPoints.push(raw[raw.length-1]);
  pathLengths=[0]; pathTotal=0;
  for(let i=1;i<pathPoints.length;i++){pathTotal+=dist(pathPoints[i-1],pathPoints[i]);pathLengths.push(pathTotal);}
}
function pointAtPathDistance(d){
  d=clamp(d,0,pathTotal); let lo=0,hi=pathLengths.length-1;
  while(lo<hi){const m=(lo+hi)>>1;if(pathLengths[m]<d)lo=m+1;else hi=m;}
  const i=Math.max(1,lo); const a=pathPoints[i-1],b=pathPoints[i]; const span=pathLengths[i]-pathLengths[i-1]||1; const t=(d-pathLengths[i-1])/span;
  const p={x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}; const n=norm(-(b.y-a.y),b.x-a.x); return {x:p.x,y:p.y,nx:n.x,ny:n.y};
}
function sweetTarget(index){
  const lanes=5; const row=Math.floor(index/lanes); const lane=index%lanes; const radius=clamp(W*.017,5.6,7.4); const laneGap=radius*1.8;
  const rows=Math.max(1,Math.ceil(queue.length/lanes)); const rowGap=clamp(pathTotal/(rows+3),radius*1.75,radius*2.25);
  const d=pathTotal-(row+1)*rowGap; const p=pointAtPathDistance(d); const off=(lane-(lanes-1)/2)*laneGap;
  return {x:p.x+p.nx*off,y:p.y+p.ny*off,r:radius};
}
function outletPoint(){ const p=pointAtPathDistance(pathTotal); return {x:p.x,y:p.y}; }

function makeSlots(){
  slots=[];
  const p=layout.park; const margin=W*.045; const slotW=W*.105; const gap=W*.018; const cy=p.y+p.h*.50;
  // VIP on left
  slots.push({kind:'vip',active:false,occupied:null,cx:margin+slotW*.5,cy,w:slotW,h:p.h*.54,angle:-.11});
  let x=margin+slotW+gap;
  for(let i=0;i<4;i++){slots.push({kind:'regular',active:true,occupied:null,cx:x+slotW*.5,cy,w:slotW,h:p.h*.54,angle:-.11});x+=slotW+gap;}
  for(let i=0;i<3;i++){slots.push({kind:'plus',active:false,occupied:null,cx:x+slotW*.5,cy,w:slotW,h:p.h*.54,angle:-.11});x+=slotW+gap;}
}

function cellKey(x,y){return x+','+y;}
function truckCells(t){ const out=[]; for(let i=0;i<t.len;i++) out.push(t.axis==='h'?{x:t.gx+i,y:t.gy}:{x:t.gx,y:t.gy+i}); return out; }
function occupancy(list){ const m=new Map(); for(const t of list) for(const c of truckCells(t)) m.set(cellKey(c.x,c.y),t.id); return m; }
function isClearTruck(t,list){
  const occ=occupancy(list); if(t.axis==='h'){
    let x=t.dir>0?t.gx+t.len:t.gx-1; const end=t.dir>0?gridCols-1:0; const st=t.dir>0?1:-1;
    for(;t.dir>0?x<=end:x>=end;x+=st){const id=occ.get(cellKey(x,t.gy));if(id&&id!==t.id)return false;}
  }else{
    let y=t.dir>0?t.gy+t.len:t.gy-1; const end=t.dir>0?gridRows-1:0; const st=t.dir>0?1:-1;
    for(;t.dir>0?y<=end:y>=end;y+=st){const id=occ.get(cellKey(t.gx,y));if(id&&id!==t.id)return false;}
  } return true;
}
function solveOrderFor(list,rng){
  const rem=list.map(t=>({...t})),order=[];
  while(rem.length){ const clear=rem.filter(t=>isClearTruck(t,rem)); if(!clear.length)return null; const t=choice(rng,clear);order.push(t.id);rem.splice(rem.findIndex(x=>x.id===t.id),1); }
  return order;
}
function generateBoard(lvl){
  currentSeed=lvl*9049+177; const baseRng=seeded(currentSeed);
  gridCols=9+(lvl>=7?1:0); gridRows=10;
  const target=Math.min(17+Math.floor((lvl-1)*1.15),27);
  let accepted=null,order=null;
  for(let attempt=0;attempt<450&&!accepted;attempt++){
    const rng=seeded(currentSeed+attempt*811); const list=[]; const occ=new Set(); let tries=0;
    while(list.length<target&&tries<1800){tries++; const axis=rng()<.5?'h':'v'; const len=rng()<(lvl<4?.18:.32)?3:2; const gx=axis==='h'?ri(rng,0,gridCols-len):ri(rng,0,gridCols-1); const gy=axis==='v'?ri(rng,0,gridRows-len):ri(rng,0,gridRows-1); const cells=[]; let bad=false; for(let i=0;i<len;i++){const c=axis==='h'?{x:gx+i,y:gy}:{x:gx,y:gy+i};const k=cellKey(c.x,c.y);if(occ.has(k)){bad=true;break;}cells.push(k);} if(bad)continue;
      const dir=rng()<.5?-1:1; const id='t'+list.length; const capacity=len===2?(rng()<.55?6:10):(rng()<.55?16:24); const t={id,gx,gy,axis,len,dir,capacity,remaining:capacity,color:null,hidden:false,shakeUntil:0}; list.push(t);cells.forEach(k=>occ.add(k));
    }
    if(list.length<Math.max(13,target-3))continue;
    const sol=solveOrderFor(list,rng); if(!sol)continue;
    const coverage=[...occ].length/(gridCols*gridRows); if(coverage<.50)continue;
    accepted=list;order=sol;
  }
  if(!accepted){
    accepted=[]; let id=0; for(let y=0;y<gridRows;y+=2){for(let x=0;x<gridCols-1;x+=2){accepted.push({id:'t'+id++,gx:x,gy:y,axis:'h',len:2,dir:(y/2)%2?1:-1,capacity:6,remaining:6,color:null,hidden:false,shakeUntil:0});}}
    order=solveOrderFor(accepted,baseRng)||accepted.map(t=>t.id);
  }

  const byId=Object.fromEntries(accepted.map(t=>[t.id,t]));
  let depth=0;
  for(let d=Math.min(3,order.length-1);d>=1;d--){ const cand=byId[order[d]]; if(!isClearTruck(cand,accepted)){depth=d;break;} }
  const colorCount=Math.min(3+Math.floor((lvl-1)/3),8); const palette=COLORS.slice(0,colorCount).map(c=>c.id);
  const initialClear=new Set(accepted.filter(t=>isClearTruck(t,accepted)).map(t=>t.id));
  const targetBus=byId[order[depth]]; const targetColor=palette[(lvl-1)%palette.length]; targetBus.color=targetColor;
  for(const t of accepted){ if(t===targetBus)continue; let avail=palette; if(initialClear.has(t.id)&&t.id!==targetBus.id&&palette.length>1) avail=palette.filter(c=>c!==targetColor); t.color=choice(baseRng,avail); }
  if(lvl>=8){ for(const t of accepted){ if(!initialClear.has(t.id)&&baseRng()<.16)t.hidden=true; } targetBus.hidden=false; }
  const qOrder=[order[depth],...order.slice(0,depth),...order.slice(depth+1)];
  boardGenerationOrder=qOrder.slice();
  const q=[]; let qid=0;
  for(const id of qOrder){const t=byId[id];for(let i=0;i<t.capacity;i++)q.push({id:'s'+qid++,color:t.color,x:null,y:null});}
  return {trucks:accepted,queue:q};
}

function startLevel(lvl){
  level=Math.max(1,lvl); overlay=null;paused=false;loading=null;movingTrucks=[];flyingSweets=[];confetti=[];inputLockUntil=0;makeSlots();
  const g=generateBoard(level); trucks=g.trucks; allTruckData=trucks.map(t=>({...t})); queue=g.queue;
  buildTrackPath(level); for(let i=0;i<queue.length;i++){const p=sweetTarget(i);queue[i].x=p.x;queue[i].y=p.y;}
  levelStartTime=now(); save(); toastMsg('Tap a truck with a clear path');
}

function boardCellSize(){ const b=layout.board; return Math.min(b.w/gridCols,b.h/gridRows)*.98; }
function boardOrigin(){ const cs=boardCellSize(); return {x:layout.board.x+(layout.board.w-gridCols*cs)/2,y:layout.board.y+(layout.board.h-gridRows*cs)/2,cs}; }
function truckPose(t){
  const o=boardOrigin(),cs=o.cs; const cx=o.x+(t.gx+(t.axis==='h'?t.len/2:.5))*cs; const cy=o.y+(t.gy+(t.axis==='v'?t.len/2:.5))*cs;
  let angle=0;if(t.axis==='h')angle=t.dir>0?0:Math.PI;else angle=t.dir>0?Math.PI/2:-Math.PI/2;
  return {x:cx,y:cy,angle,len:t.len*cs*.94,width:cs*.68};
}
function truckHit(t,x,y){ const p=truckPose(t),dx=x-p.x,dy=y-p.y,c=Math.cos(-p.angle),s=Math.sin(-p.angle),lx=dx*c-dy*s,ly=dx*s+dy*c;return Math.abs(lx)<=p.len/2&&Math.abs(ly)<=p.width/2; }

function nextFreeSlot(){
  for(let i=1;i<=4;i++)if(slots[i].active&&!slots[i].occupied)return i;
  if(slots[0].active&&!slots[0].occupied)return 0;
  for(let i=5;i<slots.length;i++)if(slots[i].active&&!slots[i].occupied)return i;
  return -1;
}
function activeSlotCount(){return slots.filter(s=>s.active).length;}
function occupiedSlotCount(){return slots.filter(s=>s.active&&s.occupied).length;}
function parkedTrucks(){ return slots.filter(s=>s.occupied).map(s=>s.occupied); }
function findOriginalTruck(id){return allTruckData.find(t=>t.id===id)||trucks.find(t=>t.id===id);}

function clickTruck(t){
  if(paused||overlay||now()<inputLockUntil)return;
  if(!isClearTruck(t,trucks)){t.shakeUntil=now()+350;toastMsg('Blocked!');buzz(25);beep(130,.04);return;}
  const slotIndex=nextFreeSlot(); if(slotIndex<0){showFail();return;}
  const pose=truckPose(t); const slot=slots[slotIndex]; slot.occupied={...t,remaining:t.remaining,slotIndex,status:'reserved'};
  trucks=trucks.filter(x=>x.id!==t.id);
  revealNewlyExposed();
  movingTrucks.push(makeDriveAnimation(slot.occupied,pose,slotIndex)); inputLockUntil=now()+520; beep(440,.035);buzz(12);
}
function revealNewlyExposed(){
  for(const t of trucks){ if(t.hidden&&isClearTruck(t,trucks)){t.hidden=false; t.revealAt=now();} }
}
function makeDriveAnimation(t,pose,slotIndex){
  const b=layout.board, slot=slots[slotIndex]; let ex=pose.x,ey=pose.y;
  if(t.axis==='h') ex=t.dir>0?b.x+b.w+pose.len*.55:b.x-pose.len*.55; else ey=t.dir>0?b.y+b.h+pose.len*.55:b.y-pose.len*.55;
  const roadY=layout.park.y+layout.park.h+4; const stage={x:slot.cx,y:roadY}; const end={x:slot.cx,y:slot.cy};
  return {truck:t,start:now(),dur:720,from:{x:pose.x,y:pose.y,angle:pose.angle,len:pose.len,width:pose.width},exit:{x:ex,y:ey},stage,end,slotIndex};
}
function drivePose(m,t){
  const p=m.from; if(t<.38){const q=easeOutCubic(t/.38);return{x:lerp(p.x,m.exit.x,q),y:lerp(p.y,m.exit.y,q),angle:p.angle,len:p.len,width:p.width};}
  if(t<.77){const q=easeInOut((t-.38)/.39);const x=lerp(m.exit.x,m.stage.x,q),y=lerp(m.exit.y,m.stage.y,q);const tang=Math.atan2(m.stage.y-m.exit.y,m.stage.x-m.exit.x);return{x,y,angle:lerpAngle(p.angle,tang,q),len:lerp(p.len,slots[m.slotIndex].h*.84,q),width:lerp(p.width,slots[m.slotIndex].w*.58,q)};}
  const q=easeOutCubic((t-.77)/.23);const slot=slots[m.slotIndex];return{x:lerp(m.stage.x,m.end.x,q),y:lerp(m.stage.y,m.end.y,q),angle:lerpAngle(Math.atan2(m.end.y-m.stage.y,m.end.x-m.stage.x),-Math.PI/2+slot.angle,q),len:slot.h*.84,width:slot.w*.58};
}
function lerpAngle(a,b,t){let d=((b-a+Math.PI)%(TAU))-Math.PI;return a+d*t;}

function updateMoving(time){
  for(let i=movingTrucks.length-1;i>=0;i--){const m=movingTrucks[i];const t=clamp((time-m.start)/m.dur,0,1);m.pose=drivePose(m,t);if(t>=1){const s=slots[m.slotIndex];if(s.occupied)s.occupied.status='parked';movingTrucks.splice(i,1);beep(540,.03);}}
}

function tryLoading(time){
  if(paused||overlay||movingTrucks.length)return;
  if(loading){
    const s=slots[loading.slotIndex],pt=s&&s.occupied;if(!pt){loading=null;return;}
    if(loading.departAt){ if(time>=loading.departAt){startDeparture(loading.slotIndex);loading=null;} return; }
    if(!queue.length){ if(pt.remaining<=0){loading.departAt=time+100;} else loading=null; return; }
    if(queue[0].color!==pt.color){loading=null;return;}
    if(time>=loading.nextAt){
      const sweet=queue.shift(); const start=outletPoint(); const end={x:s.cx,y:s.cy}; flyingSweets.push({color:sweet.color,start,end,t0:time,dur:250}); pt.remaining--; beep(620+Math.min(220,(pt.capacity-pt.remaining)*9),.025);
      loading.nextAt=time+78;
      if(pt.remaining<=0)loading.departAt=time+160;
    }
    return;
  }
  if(!queue.length)return;
  const front=queue[0].color;
  let idx=-1;
  for(let i=0;i<slots.length;i++){const p=slots[i].occupied;if(p&&p.status==='parked'&&p.color===front){idx=i;break;}}
  if(idx>=0)loading={slotIndex:idx,nextAt:time+60,departAt:0};
  else if(occupiedSlotCount()>=activeSlotCount()&&movingTrucks.length===0){
    if(time-levelStartTime>800) showFail();
  }
}
function startDeparture(slotIndex){
  const s=slots[slotIndex],t=s.occupied;if(!t)return; t.status='departing';
  const len=s.h*.84,width=s.w*.58; const start={x:s.cx,y:s.cy,angle:-Math.PI/2+s.angle,len,width}; const roadY=layout.park.y+layout.park.h+5; const side=slotIndex%2?1:-1;
  movingTrucks.push({truck:t,start:now(),dur:520,depart:true,from:start,exit:{x:s.cx,y:roadY},stage:{x:side>0?W+90:-90,y:roadY},end:{x:side>0?W+150:-150,y:roadY},slotIndex});
  s.occupied=null; confettiBurst(s.cx,s.cy,t.color,10); beep(760,.04);
}
function updateDepartures(time){
  // departure animations share movingTrucks, but their route differs
}
function poseForMoving(m,time){
  const t=clamp((time-m.start)/m.dur,0,1);
  if(!m.depart)return drivePose(m,t);
  const p=m.from;
  if(t<.32){const q=easeInOut(t/.32);return{x:lerp(p.x,m.exit.x,q),y:lerp(p.y,m.exit.y,q),angle:lerpAngle(p.angle,0,q),len:p.len,width:p.width};}
  const q=easeOutCubic((t-.32)/.68);return{x:lerp(m.exit.x,m.end.x,q),y:lerp(m.exit.y,m.end.y,q),angle:0,len:p.len,width:p.width};
}
function updateMoving2(time){
  for(let i=movingTrucks.length-1;i>=0;i--){const m=movingTrucks[i];const t=clamp((time-m.start)/m.dur,0,1);m.pose=poseForMoving(m,time);if(t>=1){if(!m.depart){const s=slots[m.slotIndex];if(s.occupied)s.occupied.status='parked';beep(540,.03);} movingTrucks.splice(i,1);}}
}

function updateFlying(time,dt){
  for(let i=flyingSweets.length-1;i>=0;i--){const f=flyingSweets[i];const t=clamp((time-f.t0)/f.dur,0,1);const q=easeInOut(t);const mx=(f.start.x+f.end.x)/2,my=Math.min(f.start.y,f.end.y)-42;const a=(1-q)*(1-q),b=2*(1-q)*q,c=q*q;f.x=a*f.start.x+b*mx+c*f.end.x;f.y=a*f.start.y+b*my+c*f.end.y;f.scale=1-.5*q;if(t>=1)flyingSweets.splice(i,1);}
  for(let i=0;i<queue.length;i++){const target=sweetTarget(i),s=queue[i]; if(s.x==null){s.x=target.x;s.y=target.y;} const k=1-Math.pow(.001,dt/1000);s.x=lerp(s.x,target.x,k);s.y=lerp(s.y,target.y,k);}
}
function confettiBurst(x,y,colorId,n){const c=color(colorId);for(let i=0;i<n;i++)confetti.push({x,y,vx:(Math.random()-.5)*150,vy:-50-Math.random()*130,life:700+Math.random()*500,t0:now(),hex:i%3?c.hex:'#ffd632'});}
function updateConfetti(time,dt){for(let i=confetti.length-1;i>=0;i--){const p=confetti[i],age=time-p.t0;if(age>p.life){confetti.splice(i,1);continue;}p.vy+=260*dt/1000;p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.rot=(p.rot||0)+dt*.008;}}

function checkWin(){
  if(!queue.length&&!trucks.length&&!movingTrucks.length&&slots.every(s=>!s.occupied)&&!overlay){coins+=50;save();for(let i=0;i<90;i++)confetti.push({x:Math.random()*W,y:-20-Math.random()*H*.25,vx:(Math.random()-.5)*90,vy:100+Math.random()*180,life:1500+Math.random()*1200,t0:now(),hex:choice(Math.random,COLORS).hex});overlay={type:'win',shownAt:now()};beep(880,.08);setTimeout(()=>beep(1080,.08),90);}
}
function showFail(){ if(overlay)return;overlay={type:'fail',shownAt:now()};beep(150,.12);buzz([35,30,55]); }

function unlockExtra(){
  if(coins<100){toastMsg('100 coins needed');return false;}
  const candidate=slots.findIndex((s,i)=>!s.active&&(s.kind==='plus'||s.kind==='vip'));
  if(candidate<0){toastMsg('All spaces already open');return false;} coins-=100;slots[candidate].active=true;save();overlay=null;toastMsg('Extra parking space opened');return true;
}

function drawBackground(){
  const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#d9e7f0');grad.addColorStop(.54,'#e9f0f5');grad.addColorStop(1,'#d8e2ec');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // subtle tiled paving in queue area
  ctx.save();ctx.globalAlpha=.24;ctx.strokeStyle='#8fa0ac';ctx.lineWidth=.6;const s=26;for(let x=0;x<W;x+=s){ctx.beginPath();ctx.moveTo(x,layout.track.y);ctx.lineTo(x,layout.park.y);ctx.stroke();}for(let y=layout.track.y;y<layout.park.y;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.restore();
}
function drawTopUI(){
  const y=layout.top.h*.53;
  drawRoundButton(34,y,24,'↻'); drawRoundButton(W-34,y,24,'Ⅱ');
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${clamp(W*.050,18,23)}px Arial`;ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.strokeText('Level '+level,W/2,y);ctx.fillStyle='#202736';ctx.fillText('Level '+level,W/2,y);ctx.restore();
  // coin bubble
  ctx.save();ctx.font='800 12px Arial';const tw=ctx.measureText(coins).width;roundRectPath(ctx,W/2-tw/2-17,layout.top.h-15,tw+34,20,10);ctx.fillStyle='rgba(255,255,255,.80)';ctx.fill();ctx.beginPath();ctx.arc(W/2-tw/2-7,layout.top.h-5,6,0,TAU);ctx.fillStyle='#ffc928';ctx.fill();ctx.fillStyle='#5b6370';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(coins,W/2-tw/2+2,layout.top.h-5);ctx.restore();
}
function drawRoundButton(x,y,r,label){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);let g=ctx.createLinearGradient(x,y-r,x,y+r);g.addColorStop(0,'#2baef4');g.addColorStop(1,'#0865b5');ctx.fillStyle=g;ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=3;ctx.shadowOffsetY=2;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.shadowColor='transparent';ctx.fillStyle='#fff';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y+1);ctx.restore();}
function drawTrack(){
  if(pathPoints.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  const r=clamp(W*.096,34,43);
  pathStroke(r+10,'rgba(68,79,92,.26)');pathStroke(r+8,'#f9fbff');pathStroke(r+2,'#b6c0ca');pathStroke(r,'#edf2f4');
  // inner shine edges
  ctx.globalAlpha=.45;pathStroke(r-5,'#f8fbfc');ctx.restore();
  // sweets back-to-front to give packed depth
  for(let i=queue.length-1;i>=0;i--)drawSweet(queue[i].x,queue[i].y,color(queue[i].color),clamp(W*.017,5.6,7.4),1);
}
function pathStroke(width,stroke){ctx.beginPath();ctx.moveTo(pathPoints[0].x,pathPoints[0].y);for(let i=1;i<pathPoints.length;i++)ctx.lineTo(pathPoints[i].x,pathPoints[i].y);ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke();}
function drawSweet(x,y,c,r,scale=1){r*=scale;ctx.save();ctx.translate(x,y);ctx.shadowColor='rgba(0,0,0,.20)';ctx.shadowBlur=2;ctx.shadowOffsetY=2;ctx.beginPath();ctx.arc(0,0,r,0,TAU);const g=ctx.createRadialGradient(-r*.35,-r*.45,r*.1,0,0,r);g.addColorStop(0,c.light);g.addColorStop(.43,c.hex);g.addColorStop(1,c.dark);ctx.fillStyle=g;ctx.fill();ctx.shadowColor='transparent';ctx.beginPath();ctx.ellipse(-r*.28,-r*.35,r*.28,r*.17,-.45,0,TAU);ctx.fillStyle='rgba(255,255,255,.48)';ctx.fill();ctx.restore();}
function drawDecor(){
  const y=layout.park.y-3;for(const x of [22,W-22]){ctx.save();ctx.strokeStyle='#697b88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y-25);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#6f7f8a';ctx.fillRect(x-7,y-26,12,3);ctx.beginPath();ctx.arc(x+(x<W/2?-8:8),y+2,8,0,TAU);ctx.fillStyle='#92c61a';ctx.fill();ctx.restore();}
}
function drawParking(){
  const p=layout.park;ctx.save();ctx.beginPath();ctx.moveTo(0,p.y+p.h*.18);ctx.quadraticCurveTo(W*.05,p.y,W*.13,p.y);ctx.lineTo(W*.87,p.y);ctx.quadraticCurveTo(W*.95,p.y,W,p.y+p.h*.18);ctx.lineTo(W,p.y+p.h);ctx.lineTo(0,p.y+p.h);ctx.closePath();let g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);g.addColorStop(0,'#8d92a3');g.addColorStop(1,'#747b90');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  for(let i=0;i<slots.length;i++)drawSlot(slots[i],i);
  ctx.save();ctx.fillStyle='#f8fafc';ctx.fillRect(0,p.y+p.h-2,W,4);ctx.fillStyle='#697482';ctx.globalAlpha=.25;ctx.fillRect(0,p.y+p.h+2,W,3);ctx.restore();
}
function drawSlot(s,i){
  ctx.save();ctx.translate(s.cx,s.cy);ctx.rotate(s.angle);const x=-s.w/2,y=-s.h/2;
  if(s.kind==='vip'&&!s.active){roundRectPath(ctx,x,y,s.w,s.h,7);ctx.fillStyle='#c7a900';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ffe95b';ctx.stroke();ctx.fillStyle='#fff3a5';ctx.font='900 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('VIP',0,0);ctx.restore();return;}
  roundRectPath(ctx,x,y,s.w,s.h,7);ctx.fillStyle=s.active?'rgba(94,102,125,.18)':'rgba(50,58,77,.22)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=s.active?'rgba(226,235,246,.75)':'#41485e';ctx.setLineDash(s.active?[]:[5,4]);ctx.stroke();ctx.setLineDash([]);
  if(!s.active){ctx.fillStyle='#43e33c';ctx.font=`900 ${Math.max(20,s.w*.55)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=2;ctx.fillText('+',0,1);}ctx.restore();
  if(s.occupied&&s.occupied.status!=='reserved'&&s.occupied.status!=='departing'){
    const ang=-Math.PI/2+s.angle;drawTruckGraphic(s.occupied,s.cx,s.cy,ang,s.h*.84,s.w*.58,1);
    drawSeatCounter(s.cx,s.cy+s.h*.57,s.occupied.remaining,s.occupied.color);
  }
}
function drawSeatCounter(x,y,num,colorId){ctx.save();const c=color(colorId);ctx.font='900 13px Arial';const w=Math.max(25,ctx.measureText(String(num)).width+14);roundRectPath(ctx,x-w/2,y-9,w,19,9);ctx.fillStyle=c.hex;ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=3;ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=2;ctx.strokeText(String(num),x,y+1);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(num),x,y+1);ctx.restore();}
function drawBoard(){
  const b=layout.board;ctx.save();let g=ctx.createLinearGradient(0,b.y,0,b.y+b.h);g.addColorStop(0,'#d9e1e9');g.addColorStop(1,'#cbd7e3');ctx.fillStyle=g;ctx.fillRect(0,b.y,W,H-b.y);ctx.restore();
  // faint road dust / dots
  ctx.save();ctx.globalAlpha=.13;ctx.fillStyle='#8092a1';for(let i=0;i<80;i++){const x=((i*71+level*13)%997)/997*W,y=b.y+(((i*97+level*31)%991)/991)*b.h;ctx.beginPath();ctx.arc(x,y,1.1,0,TAU);ctx.fill();}ctx.restore();
  for(const t of trucks)drawBoardTruck(t);
}
function drawBoardTruck(t){const p=truckPose(t);let ox=0,oy=0;if(t.shakeUntil>now()){const a=(t.shakeUntil-now())/350;ox=Math.sin(now()*.07)*5*a;}let alpha=1;if(t.revealAt&&now()-t.revealAt<300)alpha=.55+.45*((now()-t.revealAt)/300);drawTruckGraphic(t,p.x+ox,p.y+oy,p.angle,p.len,p.width,alpha);}
function drawTruckGraphic(t,x,y,angle,len,width,alpha=1){
  const c=t.hidden?color('black'):color(t.color);ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(angle);
  // shadow
  ctx.save();ctx.translate(2.5,4);roundRectPath(ctx,-len/2,-width/2,len,width,width*.19);ctx.fillStyle='rgba(42,49,58,.35)';ctx.fill();ctx.restore();
  // wheels
  ctx.fillStyle='#24282f';const ww=Math.max(3,width*.14),wh=Math.max(6,len*.18);for(const sx of [-1,1])for(const sy of [-1,1]){roundRectPath(ctx,sy*len*.24-wh/2,sx*(width*.5+1)-ww/2,wh,ww,2);ctx.fill();}
  // body
  const gr=ctx.createLinearGradient(0,-width/2,0,width/2);gr.addColorStop(0,c.light);gr.addColorStop(.28,c.hex);gr.addColorStop(1,c.dark);roundRectPath(ctx,-len/2,-width/2,len,width,width*.18);ctx.fillStyle=gr;ctx.fill();ctx.lineWidth=Math.max(1.2,width*.055);ctx.strokeStyle='rgba(0,0,0,.27)';ctx.stroke();
  // roof panel
  roundRectPath(ctx,-len*.30,-width*.34,len*.46,width*.68,width*.12);ctx.fillStyle='rgba(255,255,255,.14)';ctx.fill();
  // front cab + windshield at +x
  roundRectPath(ctx,len*.28,-width*.34,len*.16,width*.68,width*.08);ctx.fillStyle='rgba(255,255,255,.23)';ctx.fill();
  ctx.fillStyle='#27647b';roundRectPath(ctx,len*.325,-width*.26,len*.075,width*.52,width*.04);ctx.fill();
  // rear light line
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(-len*.41,-width*.29,Math.max(2,len*.025),width*.58);
  // arrow or ?
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=2;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,width*.11);ctx.lineCap='round';ctx.lineJoin='round';
  if(t.hidden){ctx.font=`900 ${Math.max(13,width*.55)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',0,0);}else{ctx.beginPath();ctx.moveTo(-len*.18,0);ctx.lineTo(len*.14,0);ctx.stroke();ctx.beginPath();ctx.moveTo(len*.13,-width*.20);ctx.lineTo(len*.31,0);ctx.lineTo(len*.13,width*.20);ctx.stroke();}
  ctx.restore();
}
function drawMoving(time){for(const m of movingTrucks){const p=m.pose||poseForMoving(m,time);drawTruckGraphic(m.truck,p.x,p.y,p.angle,p.len,p.width,1);}}
function drawFlying(){for(const f of flyingSweets)drawSweet(f.x,f.y,color(f.color),clamp(W*.017,5.6,7.4),f.scale||1);}
function drawConfetti(time){ctx.save();for(const p of confetti){const age=time-p.t0,a=clamp(1-age/p.life,0,1);ctx.globalAlpha=a;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.fillStyle=p.hex;ctx.fillRect(-3,-6,6,12);ctx.restore();}ctx.restore();}
function drawToast(time){if(time>toast.until||!toast.text)return;ctx.save();ctx.font='800 12px Arial';const tw=ctx.measureText(toast.text).width,w=Math.min(W-28,tw+28),x=(W-w)/2,y=layout.board.y+8;roundRectPath(ctx,x,y,w,29,14);ctx.fillStyle='rgba(34,42,55,.82)';ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(toast.text,W/2,y+14.5);ctx.restore();}
function toastMsg(t,d=1300){toast={text:t,until:now()+d};}

function drawOverlay(){if(!overlay)return;ctx.save();ctx.fillStyle='rgba(25,31,42,.52)';ctx.fillRect(0,0,W,H);const cw=Math.min(W*.84,350),ch=overlay.type==='pause'?225:270,cx=W/2,cy=H*.54;ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=18;roundRectPath(ctx,cx-cw/2,cy-ch/2,cw,ch,24);ctx.fillStyle='#fff';ctx.fill();ctx.shadowColor='transparent';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#273142';ctx.font='900 28px Arial';const title=overlay.type==='win'?'DELIVERED!':overlay.type==='fail'?'NO PARKING SPACES':'PAUSED';ctx.fillText(title,cx,cy-ch*.30);ctx.font='700 14px Arial';ctx.fillStyle='#70798a';if(overlay.type==='win')ctx.fillText('All sweets are loaded and on the road.',cx,cy-ch*.16);if(overlay.type==='fail')ctx.fillText('Open another space or restart the level.',cx,cy-ch*.16);
  if(overlay.type==='pause'){
    drawOverlayButton(cx,cy+20,cw*.72,48,'CONTINUE','#147bd0');drawOverlayButton(cx,cy+80,cw*.72,44,'RESTART','#e7ebf0','#455064');
  }else if(overlay.type==='win'){
    drawOverlayButton(cx,cy+35,cw*.72,50,'NEXT LEVEL','#147bd0');drawOverlayButton(cx,cy+95,cw*.72,42,'REPLAY','#e7ebf0','#455064');
  }else{
    drawOverlayButton(cx,cy+25,cw*.74,50,'OPEN + SPACE   100','#37b63c');drawOverlayButton(cx,cy+88,cw*.74,43,'RESTART','#e7ebf0','#455064');
  }ctx.restore();
}
function drawOverlayButton(cx,cy,w,h,label,fill,text='#fff'){ctx.save();roundRectPath(ctx,cx-w/2,cy-h/2,w,h,h*.28);ctx.fillStyle=fill;ctx.fill();ctx.fillStyle=text;ctx.font='900 15px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,cx,cy);ctx.restore();}

function update(time){const dt=Math.min(40,time-lastTime);lastTime=time;if(!paused){updateMoving2(time);updateFlying(time,dt);updateConfetti(time,dt);tryLoading(time);checkWin();}draw(time);requestAnimationFrame(update);}
function draw(time){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawBackground();drawTopUI();drawTrack();drawDecor();drawParking();drawBoard();drawMoving(time);drawFlying();drawConfetti(time);drawToast(time);drawOverlay();}

function getPointer(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function pointInSlot(s,x,y){const dx=x-s.cx,dy=y-s.cy,c=Math.cos(-s.angle),ss=Math.sin(-s.angle),lx=dx*c-dy*ss,ly=dx*ss+dy*c;return Math.abs(lx)<=s.w/2&&Math.abs(ly)<=s.h/2;}
function handleTap(x,y){
  if(overlay){handleOverlayTap(x,y);return;}
  const topY=layout.top.h*.53;if(Math.hypot(x-34,y-topY)<30){startLevel(level);return;}if(Math.hypot(x-(W-34),y-topY)<30){paused=true;overlay={type:'pause'};return;}
  // bonus slots
  for(let i=0;i<slots.length;i++){const s=slots[i];if(!s.active&&pointInSlot(s,x,y)){if(coins>=100){coins-=100;s.active=true;save();toastMsg(i===0?'VIP space opened':'Extra parking space opened');}else toastMsg('100 coins needed');return;}}
  if(y>=layout.board.y){for(let i=trucks.length-1;i>=0;i--){if(truckHit(trucks[i],x,y)){clickTruck(trucks[i]);return;}}}
}
function handleOverlayTap(x,y){const cw=Math.min(W*.84,350),ch=overlay.type==='pause'?225:270,cx=W/2,cy=H*.54;
  if(overlay.type==='pause'){if(Math.abs(x-cx)<cw*.36&&Math.abs(y-(cy+20))<28){paused=false;overlay=null;return;}if(Math.abs(x-cx)<cw*.36&&Math.abs(y-(cy+80))<26){startLevel(level);return;}}
  if(overlay.type==='win'){if(Math.abs(x-cx)<cw*.36&&Math.abs(y-(cy+35))<30){startLevel(level+1);return;}if(Math.abs(x-cx)<cw*.36&&Math.abs(y-(cy+95))<25){startLevel(level);return;}}
  if(overlay.type==='fail'){if(Math.abs(x-cx)<cw*.37&&Math.abs(y-(cy+25))<30){unlockExtra();return;}if(Math.abs(x-cx)<cw*.37&&Math.abs(y-(cy+88))<26){startLevel(level);return;}}
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=getPointer(e);handleTap(p.x,p.y);},{passive:false});

let audioCtx=null;
function beep(freq,dur){try{audioCtx||=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(_){} }
function buzz(v){try{navigator.vibrate&&navigator.vibrate(v);}catch(_){} }

loadSave();resize();startLevel(level);requestAnimationFrame(update);
})();
</script>
</body>
